<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Licznik: pacjenci z NF czekają</title>
<style>
  /* Ramka do osadzenia na innych stronach (iframe). Sama liczy dni w czasie polskim. */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #161616; color: #f2f2f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  a.karta { display: block; padding: 16px 16px 14px; color: inherit; text-decoration: none; min-height: 100vh; }
  .pasek { display: inline-block; background: #d32f2f; color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; }
  .wiersz { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .klapki { display: inline-flex; gap: 3px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; flex: none; }
  .k { position: relative; display: inline-block; width: .8em; height: 1.2em; line-height: 1.2em; text-align: center; color: #f4f4f4; border-radius: .09em;
       background: linear-gradient(#262626 0 50%, #2c2c2c 50% 100%); box-shadow: 0 0 0 1px #3a3a3a; }
  .k::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #161616; }
  .duzy { font-size: 46px; }
  .maly { font-size: 28px; }
  .maly .k { background: #d32f2f; box-shadow: none; }
  .opis { font-size: 15px; line-height: 1.3; font-weight: 600; }
  mark { background: #ffd43b; color: #000; padding: 0 .15em; }
  .apel { margin-top: 12px; font-size: 13px; line-height: 1.35; color: #cfcfcf; }
  .wiecej { margin-top: 8px; font-size: 13px; font-weight: 700; color: #ffd43b; }
  a.karta:hover .wiecej, a.karta:focus .wiecej { text-decoration: underline; }
</style>
</head>
<body>
<a class="karta" href="https://czekamy.nf1news.pl/" target="_blank" rel="noopener">
  <span class="pasek">Pacjenci z NF czekają</span>
  <div class="wiersz">
    <span class="klapki duzy" data-od="2026-05-01T00:00:00+02:00"></span>
    <span class="opis"><span data-j>dni</span> <mark>bez opieki medycznej</mark><br>od końca pilotażu 30.04.2026</span>
  </div>
  <div class="wiersz">
    <span class="klapki maly" data-od="2026-10-23T00:00:00+02:00"></span>
    <span class="opis"><span data-j>dni</span> milczenia Ministerstwa Zdrowia<br>od decyzji o zakończeniu prac</span>
  </div>
  <p class="apel">Pani Minister Zdrowia, Panie Ministrze, pacjenci czekają na zmianę decyzji i na dialog.</p>
  <p class="wiecej">Zobacz licznik →</p>
</a>
<script>
  (function () {
    function rysuj() {
      document.querySelectorAll('.klapki[data-od]').forEach(function (el) {
        var dni = Math.max(0, Math.floor((Date.now() - new Date(el.dataset.od).getTime()) / 86400000));
        el.innerHTML = String(dni).split('').map(function (z) { return '<span class="k">' + z + '</span>'; }).join('');
        el.setAttribute('aria-label', dni + (dni === 1 ? ' dzień' : ' dni'));
        el.parentNode.querySelector('[data-j]').textContent = dni === 1 ? 'dzień' : 'dni';
      });
    }
    rysuj();
    setInterval(rysuj, 60000);
  })();
</script>
</body>
</html>
